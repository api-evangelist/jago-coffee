name: Jago Coffee
description: Jago Coffee is an Indonesian mobile coffee company operating a fleet of electric-vehicle
  coffee carts ("Jagoans") that bring freshly brewed specialty coffee, tea, and seasonal drinks directly
  to neighborhoods across Indonesia. Billing itself as the "#1 Cafe on Wheels," Jago lets customers order
  through its mobile app with no delivery fees or order minimums, paying with GoPay or OVO digital wallets,
  using Arabica beans sourced directly from local Indonesian farmers. Backed by 500 Global, the company is
  tracked in the API Evangelist network as a consumer coffee-delivery business; as of this enrichment pass
  it publishes no public API, developer portal, or SDK.
